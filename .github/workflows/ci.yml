name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Install OpenSSL 3, CMake and cmocka
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake libcmocka-dev

      - name: Assemble the jar
        run: mvn -B package

      # Configure generates a new random secret on every run. It is never stored.
      - name: Compile the secret build with a throwaway secret
        run: |
          cmake . -DCMAKE_BUILD_TYPE=Release
          make

      - name: Run the C tests
        run: ctest --output-on-failure

      # Reconfigure the same tree without the secret. make recompiles the library.
      - name: Compile the no-secrets build
        run: |
          cmake . -DINCLUDE_SECRETS=OFF
          make

      # NoSecretsTest exits 1 if createSecureHash does not throw UnsupportedOperationException.
      - name: Run the no-secrets Java check
        run: |
          jar=$(ls target/linkja-crypto-*.jar)
          javac -cp "$jar" -d target/test-classes src/test/java/NoSecretsTest.java
          java -cp "$jar:target/test-classes" -Djava.library.path=target NoSecretsTest
